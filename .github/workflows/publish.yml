name: Publish NuGet packages

on:
  push:
    branches: [ master, beta ]
  workflow_dispatch: {}

# One publish at a time, so two merges can't compute the same version.
concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version
        id: version
        run: |
          # Next stable = last release tag + 1, so stable versions never skip numbers.
          last=$(git tag --list 'v1.0.*' | grep -E '^v1\.0\.[0-9]+$' | cut -d. -f3 | sort -n | tail -n1)

          if [ -z "$last" ]; then
            # No release tag yet: continue from the highest stable version on nuget.org.
            last=$(curl -fsS https://api.nuget.org/v3-flatcontainer/core.applicationlayer/index.json \
              | jq -r '.versions[]' | grep -E '^1\.0\.[0-9]+$' | cut -d. -f3 | sort -n | tail -n1)
          fi

          version="1.0.$(( ${last:-0} + 1 ))"

          # Beta is a preview of the next stable version.
          if [ "${{ github.ref_name }}" = "beta" ]; then
            version="${version}-beta.${{ github.run_number }}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Core.Packages.sln

      - name: Build and pack
        run: |
          dotnet build Core.Packages.sln \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageOutputPath=${{ github.workspace }}/nupkgs

      # ==========================================
      # GitHub Packages
      # ==========================================

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/yahyaerdoan/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Push packages to GitHub Packages
        run: |
          packages=(nupkgs/*.nupkg)

          if [ ! -e "${packages[0]}" ]; then
            echo "No .nupkg files found in nupkgs"
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --source "github" \
              --skip-duplicate
          done

      # ==========================================
      # NuGet.org
      # ==========================================

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        run: |
          packages=(nupkgs/*.nupkg)

          if [ ! -e "${packages[0]}" ]; then
            echo "No .nupkg files found in nupkgs"
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

      # ==========================================
      # Release tag (stable only): the next version counts from it
      # ==========================================

      - name: Tag the release
        if: github.ref_name == 'master'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
